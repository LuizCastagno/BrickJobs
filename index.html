<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>BrickJobs — Construtoras e Trabalhadores em Rondonópolis-MT</title>
    <meta name="description" content="Aplicativo multiplataforma que conecta construtoras e trabalhadores da construção civil em Rondonópolis, Mato Grosso." />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="BrickJobs" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="shortcut icon" type="image/svg+xml" href="/icon.svg" />
    <meta property="og:title" content="BrickJobs — Construtoras e Trabalhadores em Rondonópolis-MT" />
    <meta property="og:description" content="Cadastro de construtoras, busca de profissionais, currículos em PDF ou experiências e vagas por região em Rondonópolis-MT." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      try {
        if (localStorage.getItem('brickjobs_theme_v1') === 'dark') {
          document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = 'dark';
          var metaTheme = document.querySelector('meta[name="theme-color"]');
          if (metaTheme) metaTheme.setAttribute('content', '#111827');
        }
      } catch (e) {}
    </script>
  </head>
  <body class="bg-[#F4F5F7] dark:bg-[#0B1120] text-[#111827] dark:text-[#F8FAFC] antialiased selection:bg-[#C93B1E]/15 selection:text-[#C93B1E]">
    <div id="root"></div>
    <noscript>
      <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;font-family:system-ui,-apple-system,sans-serif;">
        <div style="max-width:460px;background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:24px;color:#111827;">
          <h1 style="margin:0 0 8px;font-size:20px;font-weight:700;">Ative o JavaScript para carregar o BrickJobs</h1>
          <p style="margin:0;font-size:14px;color:#4b5563;line-height:1.5;">O aplicativo precisa de JavaScript habilitado no navegador para exibir as vagas e portais.</p>
        </div>
      </div>
    </noscript>
    <script>
      (function () {
        function renderBootFallback() {
          if (window.__BRICKJOBS_APP_READY__) return;
          var root = document.getElementById('root');
          if (!root || root.hasChildNodes()) return;
          var isDark = document.documentElement.classList.contains('dark');
          root.innerHTML =
            '<div role="alert" style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;font-family:system-ui,-apple-system,sans-serif;background:' +
            (isDark ? '#0B1120' : '#F4F5F7') +
            ';">' +
            '<div style="max-width:480px;width:100%;background:' +
            (isDark ? '#111827' : '#FFFFFF') +
            ';border:1px solid ' +
            (isDark ? '#1E293B' : '#E5E7EB') +
            ';border-radius:16px;padding:28px;color:' +
            (isDark ? '#F8FAFC' : '#111827') +
            ';box-shadow:0 4px 20px rgba(0,0,0,0.06);">' +
            '<p style="margin:0 0 8px;font-size:12px;font-weight:700;color:#C93B1E;text-transform:uppercase;letter-spacing:0.04em;">Falha de carregamento inicial</p>' +
            '<h1 style="margin:0 0 10px;font-size:20px;font-weight:700;line-height:1.3;">Não foi possível carregar o BrickJobs</h1>' +
            '<p style="margin:0 0 20px;font-size:14px;color:' +
            (isDark ? '#CBD5E1' : '#4B5563') +
            ';line-height:1.5;">Verifique sua conexão com a internet ou recarregue a página para tentar novamente.</p>' +
            '<button type="button" onclick="window.location.reload()" style="min-height:44px;padding:10px 20px;border:none;border-radius:12px;background:#C93B1E;color:#FFFFFF;font-size:14px;font-weight:600;cursor:pointer;">Recarregar página</button>' +
            '</div></div>';
        }
        window.addEventListener(
          'error',
          function (e) {
            if (!window.__BRICKJOBS_APP_READY__ && e && e.target && e.target.tagName === 'SCRIPT') {
              renderBootFallback();
            }
          },
          true
        );
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
